<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture: LinkedIn's daily Easy Apply limit</title></head>
<!-- Live 2026-10-06: once LinkedIn's daily limit is reached, clicking Easy
     Apply opens this notice in a native <dialog> in place of the form - its
     only button is "Got it". Text as shown, markup trimmed. -->
<body>
  <button id="apply" aria-label="Easy Apply to this job">Easy Apply</button>
  <dialog id="limit" aria-labelledby="dialog-header">
    <h2 id="dialog-header">You reached today’s Easy Apply limit</h2>
    <p>Great effort applying today. We limit Easy Apply submissions to help ensure each application gets the
      right attention. Save this job and continue applying tomorrow. <a href="#">Learn more</a></p>
    <button type="button">Got it</button>
  </dialog>
  <script>
    document.getElementById('apply').addEventListener('click', () => document.getElementById('limit').showModal());
  </script>
</body>
</html>
