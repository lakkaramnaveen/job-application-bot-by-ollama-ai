<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture: Easy Apply form with an unanswerable required radio group</title></head>
<!--
  Mirrors a real LinkedIn eligibility/sponsorship-style question: a
  fieldset radio group whose individual <input> elements carry
  aria-required="true" (confirmed against a live job posting's DOM -
  fieldset itself has no `required` attribute in HTML). The answer given
  in the test deliberately doesn't match either option's text, so
  _select_best_radio() leaves it unanswered by design - this fixture
  proves that case is reported by name via
  _first_unanswered_required_choice_label() rather than falling through to
  the generic "stuck on a step" message.
-->
<body>
  <button aria-label="Easy Apply">Easy Apply</button>

  <div role="dialog" aria-label="Job application">
    <fieldset>
      <legend>Are you willing to relocate?</legend>
      <input id="relocate-yes" type="radio" name="relocate" aria-required="true" />
      <label for="relocate-yes">Yes</label>
      <input id="relocate-no" type="radio" name="relocate" aria-required="true" />
      <label for="relocate-no">No</label>
    </fieldset>

    <button aria-label="Submit application">Submit application</button>
  </div>
</body>
</html>
