<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture: external application form, radio group with a checked default</title></head>
<body>
  <form>
    <label for="full-name">Full name</label>
    <input id="full-name" type="text" required />

    <fieldset>
      <legend>Are you willing to relocate?</legend>
      <label><input type="radio" name="relocate" value="yes" required /> Yes</label>
      <label><input type="radio" name="relocate" value="no" checked /> No</label>
    </fieldset>

    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
