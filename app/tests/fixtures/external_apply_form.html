<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture: external application form</title></head>
<body>
  <form>
    <label for="full-name">Full name</label>
    <input id="full-name" type="text" required />

    <label for="resume-upload">Resume</label>
    <input id="resume-upload" type="file" />

    <label for="how-heard">How did you hear about us?</label>
    <select id="how-heard">
      <option value="">Select an option</option>
      <option value="linkedin">LinkedIn</option>
      <option value="referral">Referral</option>
    </select>

    <label for="cover-note">Cover letter</label>
    <textarea id="cover-note"></textarea>

    <button type="submit">Submit Application</button>
  </form>
</body>
</html>
