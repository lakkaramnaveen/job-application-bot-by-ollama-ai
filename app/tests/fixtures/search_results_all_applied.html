<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fixture: search results, every card already applied</title></head>
<!--
  A full page of results the user has already applied to on LinkedIn - a
  common first page for an active job search. The adapter keeps zero
  postings from it but must still page on to the next page of results.
-->
<body>
  <div data-job-id="401">
    <a href="/jobs/view/401/">Backend Engineer</a>
    <span class="job-card-subtitle">Acme Corp</span>
    <span>Applied</span>
  </div>
  <div data-job-id="402">
    <a href="/jobs/view/402/">Frontend Engineer</a>
    <span class="job-card-subtitle">Widgets Inc</span>
    <span>Applied</span>
  </div>
</body>
</html>
